name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: self-hosted

    steps:
      - name: Pull backend image
        run: docker pull basheerjani0193/service-health-backend:1.0

      - name: Pull frontend image
        run: docker pull basheerjani0193/service-health-frontend:1.0

      - name: Remove old containers
        run: |
          docker rm -f service-backend || true
          docker rm -f service-frontend || true

      - name: Start backend
        run: |
          docker run -d \
            --name service-backend \
            -p 5000:5000 \
            basheerjani0193/service-health-backend:1.0

      - name: Start frontend
        run: |
          docker run -d \
            --name service-frontend \
            -p 8080:80 \
            basheerjani0193/service-health-frontend:1.0
